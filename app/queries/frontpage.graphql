#import "./fragments/HeroSection.graphql"
#import "./fragments/ContentSideBySide.graphql"

query GetFrontpage($id: ID) {
  frontpage(where: { id: $id }) {
    heroSection {
      ...HeroFragment
    }
    project {
      slug
    }
    introTitle
    introContent {
      ...ContentSideBySideFragment
    }
    spotlight {
      title
      subHeader
      slug
      image {
        ...ImageFragment
      }
    }
  }
}
