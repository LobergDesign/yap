name: Knip

on:
  push:
    branches:
      - main

jobs:
  knip:
    name: Knip report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Report-only: --no-exit-code keeps the run green, findings go to the job summary
      - name: Run Knip
        run: |
          bunx knip --reporter markdown --no-exit-code | sed -n '/^# Knip report/,$p' > knip.md
          if grep -q '^## ' knip.md; then
            cat knip.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Knip: no issues found" >> "$GITHUB_STEP_SUMMARY"
          fi
